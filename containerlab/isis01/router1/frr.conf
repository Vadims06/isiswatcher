frr version 10.8
frr defaults traditional
hostname router1
no ipv6 forwarding
!
password zebra
enable password zebra
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fc00:0:1::/48 block-len 32 node-len 16 func-bits 16
   exit
   !
  exit
  !
 exit
exit
!
router isis lab
 net 49.0001.0100.1001.0001.00
 no hostname dynamic
 mpls-te on
 mpls-te router-address 10.10.10.1
 lsp-gen-interval 1
 spf-interval 1
 segment-routing srv6
  locator MAIN
 exit
exit
!
interface eth1
 ip address 192.168.13.1/24
 ip router isis lab
 ipv6 address 3ffe::192:168:13:1/127
 ipv6 router isis lab
 isis csnp-interval 600
 isis hello-interval 3
 isis hello-multiplier 3
 isis network point-to-point
 no isis hello padding
 link-params
  enable
  admin-grp 0x647a0001
  max-bw 1.25e+07
  metric 111111
  max-bw 1e+08
  unrsv-bw 0 1.23e+06
  unrsv-bw 5 1.23e+06
 exit-link-params
exit
!
interface lo
 ip address 10.10.10.1/32
 ip router isis lab
exit
!
